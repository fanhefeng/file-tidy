name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every version's result: a failure specific to the engines floor
      # is exactly what this matrix exists to catch.
      fail-fast: false
      matrix:
        # Every supported Node line plus each supported filesystem platform.
        include:
          - os: ubuntu-latest
            node: "22.23.5"
          - os: ubuntu-latest
            node: "24.22.3"
          - os: ubuntu-latest
            node: "26.13.1"
          - os: macos-latest
            node: "26.13.1"
          - os: windows-latest
            node: "26.13.1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Install on the supported Node 22 baseline before switching to the
      # release line under test. These dependencies are pure JavaScript.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Test the selected supported release directly.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node --test test/*.test.js test-adapters/*.test.js
      # Fails when raycast/src/core or raycast/tests have drifted from the
      # originals they are generated from.
      - run: node scripts/sync.js --check

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  raycast:
    name: raycast (lint and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      # The extension directory is self-contained and has its own lockfile:
      # Store CI runs npm there, so this side must not go through pnpm.
      - run: npm ci
        working-directory: raycast
      # The same check the Store runs on a submission. Catching it here means a
      # lint failure never reaches the fork.
      - run: npm run lint
        working-directory: raycast
      - run: npm run build
        working-directory: raycast

  desktop:
    name: desktop (${{ matrix.os }}, build, package, and smoke)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Rule-model integration tests import the shared core from the root.
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run package:dir
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: xvfb-run --auto-servernum npm run test:smoke -- --packaged --no-sandbox
        if: runner.os == 'Linux'
        working-directory: desktop
      - run: npm run test:smoke -- --packaged
        if: runner.os != 'Linux'
        working-directory: desktop
      - run: npm run package -- --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-distribution-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: desktop/release/smoke/
          if-no-files-found: ignore
